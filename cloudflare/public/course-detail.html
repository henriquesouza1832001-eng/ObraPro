<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><title>Curso | ObraPro</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#10233f;font-family:Arial,sans-serif}header{background:#fff;border-bottom:1px solid #d9e0dd;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:7px;background:#f47b20;color:#fff;margin-right:10px}.back{color:#1267e8;font-weight:800}.hero{background:#10233f;color:#fff;padding:54px 5vw}.hero-inner,.content{max-width:1080px;margin:auto}.tag{display:inline-block;padding:8px 10px;border-radius:5px;background:#eef5ff;color:#1267e8;font-size:11px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;max-width:820px;margin:20px 0 16px}.hero p{max-width:760px;color:#dce5ef;font-size:18px;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:38px 5vw}.module{background:#fff;border:1px solid #d9e0dd;border-radius:7px;padding:20px;margin-top:14px}.module h2{margin:6px 0 8px;font-size:20px}.module p,.lesson{color:#60706a;line-height:1.5}.lesson{border-top:1px solid #edf0ef;padding-top:12px;margin-top:12px}.lesson strong{color:#10233f}.aside{height:max-content;background:#fff;border:1px solid #d9e0dd;border-radius:7px;padding:22px}.button{display:block;text-align:center;background:#1267e8;color:#fff;border-radius:6px;padding:14px;font-weight:800;margin-top:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:42px 5vw}.layout{padding-top:28px}}</style></head><body><header><a class="brand" href="/"><span class="mark" aria-hidden="true">⌂</span>ObraPro</a><a class="back" href="/cursos">Todos os cursos</a></header><section class="hero"><div class="hero-inner"><span class="tag" id="category">Curso</span><h1 id="title">Curso ObraPro</h1><p id="description"></p></div></section><main class="layout"><section><h2>Conteúdo do curso</h2><div id="modules"></div></section><aside class="aside"><strong>Acesso ObraPro</strong><h2>Aprenda no seu ritmo</h2><p>Conteúdo direto, com módulos curtos e checklists para acompanhar sua obra.</p><a class="button" href="/entrar">Começar agora</a><small>Estudo educativo. Não substitui projeto ou responsável técnico.</small></aside></main><script>const courses={
'planejamento-da-obra':['Planejamento','Planejamento da obra do zero','Planeje orçamento, etapas, materiais e decisões antes de começar.','Gratuito'],
'fundacoes-seguras':['Fundações','Fundações: o começo certo','Entenda sondagem, locação, escavação e cuidados antes da concretagem.','R$ 29,90'],
'estrutura-de-concreto':['Estrutura','Estrutura de concreto sem mistério','Aprenda a acompanhar formas, armação, concretagem e cura.','R$ 49,90'],
'alvenaria-na-pratica':['Alvenaria','Alvenaria na prática','Passo a passo para levantar paredes alinhadas, niveladas e bem amarradas.','R$ 29,90'],
'telhado-e-cobertura':['Cobertura','Telhado e cobertura','Escolha materiais, entenda inclinação e acompanhe a montagem com segurança.','R$ 29,90'],
'instalacoes-hidraulicas':['Hidráulica','Instalações hidráulicas','Organize água, esgoto, testes e pontos sem perder a sequência da obra.','R$ 39,90'],
'instalacoes-eletricas':['Elétrica','Instalações elétricas residenciais','Conheça circuitos, quadro, conduítes e testes com orientação responsável.','R$ 39,90'],
'revestimentos-e-pisos':['Acabamentos','Revestimentos, pisos e pintura','Prepare superfícies e acompanhe acabamentos com menos retrabalho.','R$ 29,90'],
'portas-janelas-e-impermeabilizacao':['Proteção','Esquadrias e impermeabilização','Evite infiltrações em portas, janelas, áreas molhadas e lajes.','R$ 29,90'],
'seguranca-e-qualidade-no-canteiro':['Gestão','Segurança e qualidade no canteiro','Crie rotinas simples de EPI, conferência, evidência e não conformidade.','Gratuito']};
const slug=location.pathname.split('/').filter(Boolean).pop();const course=courses[slug];if(!course){document.body.innerHTML='<main style="font-family:Arial;padding:48px"><h1>Curso não encontrado</h1><a href="/cursos">Voltar ao catálogo</a></main>';}else{document.title=course[1]+' | ObraPro';document.querySelector('#category').textContent=course[0]+' · '+course[3];document.querySelector('#title').textContent=course[1];document.querySelector('#description').textContent=course[2];document.querySelector('#modules').innerHTML=['Entenda antes de executar','Faça por etapas','Confira e registre'].map((title,index)=>`<article class="module"><small>Módulo ${index+1}</small><h2>${title}</h2><p>Orientação curta, exemplos práticos e pontos de atenção para esta etapa.</p>${['O que você precisa saber','Passo a passo da execução','Checklist de conferência'].map((lesson,lessonIndex)=>`<div class="lesson"><strong>${lesson}</strong> · ${6+lessonIndex*2} min</div>`).join('')}</article>`).join('');}</script></body></html>
