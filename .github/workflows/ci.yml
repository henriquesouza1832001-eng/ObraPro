name: CI

on:
  pull_request:
    branches: [main, develop, hotfix]
  push:
    branches: [main, develop, hotfix]

permissions:
  contents: read

jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)
              [[ "$HEAD" == "develop" || "$HEAD" == "hotfix" ]]
              ;;
            develop)
              [[ "$HEAD" == "main" || "$HEAD" == feature/* || "$HEAD" == fix/* || "$HEAD" == chore/* || "$HEAD" == docs/* || "$HEAD" == refactor/* || "$HEAD" == test/* || "$HEAD" == claude/* || "$HEAD" == codex-* ]]
              ;;
            hotfix)
              [[ "$HEAD" == hotfix/* || "$HEAD" == "main" ]]
              ;;
            *)
              exit 1
              ;;
          esac

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Build frontend
        run: npm run build

      - name: Typecheck Cloudflare Worker
        if: hashFiles('cloudflare/tsconfig.json') != '' && hashFiles('package.json') != ''
        run: |
          if npm run | grep -q 'worker:typecheck'; then
            npm run worker:typecheck
          else
            echo 'worker:typecheck ainda nao esta disponivel nesta fatia da migracao'
          fi

      - name: Build Cloudflare Worker
        if: hashFiles('wrangler.preview.jsonc') != '' && hashFiles('package.json') != ''
        run: |
          if npm run | grep -q 'worker:build'; then
            npm run worker:build
          else
            echo 'worker:build ainda nao esta disponivel nesta fatia da migracao'
          fi

      - name: Run tests
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit frontend dependencies
        run: |
          audit_output=$(npm audit --audit-level=high 2>&1) && { echo "$audit_output"; exit 0; }
          audit_status=$?
          echo "$audit_output"
          if grep -Eq '503 Service Unavailable|performing maintenance' <<< "$audit_output"; then
            echo '::warning::npm advisory service is temporarily unavailable'
            exit 0
          fi
          exit "$audit_status"

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-preview
      cancel-in-progress: true
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm

        - name: Install frontend and Worker dependencies
          run: npm ci --ignore-scripts
  
        - name: Deploy preview to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
